name: Build FMRadio APK (Android 10)

on:
  push:
    branches: [ "lineage-18.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Project Structure
        run: |
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.caf.fmradio'
              compileSdk 29

              defaultConfig {
                  applicationId "com.caf.fmradio"
                  minSdk 26
                  targetSdk 29
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              sourceSets {
                  main {
                      manifest.srcFile '../AndroidManifest.xml'
                      java.srcDirs = ['../src']
                      res.srcDirs = ['../res']
                  }
              }
              
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          # Генерируем wrapper-конфиг напрямую
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FMRadio-Android10-debug
          path: app/build/outputs/apk/debug/app-debug.apk
