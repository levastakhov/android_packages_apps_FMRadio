name: Build FMRadio APK (Android 10)

on:
  push:
    branches: [ "lineage-18.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Patch Resource Mismatch
        run: |
          echo "Fixing R.string vs R.drawable mismatch for btn_discard_recording..."
          find src -type f -name "*.java" -exec sed -i 's/R\.string\.btn_discard_recording/R.drawable.btn_discard_recording/g' {} +

      - name: Generate Gradle Project Structure & Hidden API Stubs
        run: |
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.android.fmradio'
              compileSdk 29

              defaultConfig {
                  applicationId "com.android.fmradio"
                  minSdk 26
                  targetSdk 29
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              sourceSets {
                  main {
                      manifest.srcFile '../AndroidManifest.xml'
                      java.srcDirs = ['src/stubs/java', '../src']
                      res.srcDirs = ['../res']
                  }
              }
              
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          # Создаем структуру каталогов для заглушек
          mkdir -p app/src/stubs/java/android/media
          mkdir -p app/src/stubs/java/android/os/storage
          mkdir -p app/src/stubs/java/android/view
          mkdir -p app/src/stubs/java/android/hardware/display
          mkdir -p app/src/stubs/java/com/android/internal

          # 1. com.android.internal.R
          cat << 'EOF' > app/src/stubs/java/com/android/internal/R.java
          package com.android.internal;
          public final class R {
              public static final class dimen {
                  public static int status_bar_height = 0;
              }
          }
          EOF

          # 2. MediaRecorder Stub (для AudioSource.RADIO_TUNER)
          cat << 'EOF' > app/src/stubs/java/android/media/MediaRecorder.java
          package android.media;

          public class MediaRecorder {
              public final class AudioSource {
                  public static final int DEFAULT = 0;
                  public static final int MIC = 1;
                  public static final int VOICE_UPLINK = 2;
                  public static final int VOICE_DOWNLINK = 3;
                  public static final int VOICE_CALL = 4;
                  public static final int CAMCORDER = 5;
                  public static final int VOICE_RECOGNITION = 6;
                  public static final int VOICE_COMMUNICATION = 7;
                  public static final int REMOTE_SUBMIX = 8;
                  public static final int UNPROCESSED = 9;
                  public static final int VOICE_PERFORMANCE = 10;
                  public static final int RADIO_TUNER = 1998;
              }
          }
          EOF

          # 3. AudioPort / AudioPatch infrastructure
          cat << 'EOF' > app/src/stubs/java/android/media/AudioPort.java
          package android.media;
          public class AudioPort {
              public AudioPortConfig activeConfig() { return null; }
          }
          EOF

          cat << 'EOF' > app/src/stubs/java/android/media/AudioDevicePort.java
          package android.media;
          public class AudioDevicePort extends AudioPort {
              public int type() { return 0; }
          }
          EOF

          cat << 'EOF' > app/src/stubs/java/android/media/AudioPortConfig.java
          package android.media;
          public class AudioPortConfig {
              public AudioPort port() { return null; }
          }
          EOF

          cat << 'EOF' > app/src/stubs/java/android/media/AudioDevicePortConfig.java
          package android.media;
          public class AudioDevicePortConfig extends AudioPortConfig {}
          EOF

          cat << 'EOF' > app/src/stubs/java/android/media/AudioMixPort.java
          package android.media;
          public class AudioMixPort extends AudioPort {}
          EOF

          cat << 'EOF' > app/src/stubs/java/android/media/AudioPatch.java
          package android.media;
          public class AudioPatch {
              public AudioPortConfig[] sources() { return new AudioPortConfig[0]; }
              public AudioPortConfig[] sinks() { return new AudioPortConfig[0]; }
          }
          EOF

          cat << 'EOF' > app/src/stubs/java/android/media/AudioSystem.java
          package android.media;
          public class AudioSystem {
              public static final int FORCE_NONE = 0;
              public static final int FORCE_SPEAKER = 1;
              public static final int DEVICE_IN_FM_TUNER = 0x80000400;
              public static final int DEVICE_OUT_WIRED_HEADSET = 0x4;
              public static final int DEVICE_OUT_WIRED_HEADPHONE = 0x8;
              public static int setForceUse(int usage, int config) { return 0; }
              public static int getForceUse(int usage) { return 0; }
              public static String getOutputDeviceName(int device) { return ""; }
          }
          EOF

          # 4. AudioManager
          cat << 'EOF' > app/src/stubs/java/android/media/AudioManager.java
          package android.media;
          import java.util.ArrayList;

          public class AudioManager {
              public static final int SUCCESS = 0;
              public static final int ERROR = -1;
              public static final int STREAM_MUSIC = 3;

              public static final int AUDIOFOCUS_GAIN = 1;
              public static final int AUDIOFOCUS_LOSS = -1;
              public static final int AUDIOFOCUS_LOSS_TRANSIENT = -2;
              public static final int AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK = -3;
              public static final int AUDIOFOCUS_REQUEST_GRANTED = 1;

              public interface OnAudioFocusChangeListener {
                  void onAudioFocusChange(int focusChange);
              }

              public interface OnAudioPortUpdateListener {
                  void onAudioPortListUpdate(AudioPort[] portList);
                  void onAudioPatchListUpdate(AudioPatch[] patchList);
                  void onServiceDied();
              }

              public int listAudioPorts(ArrayList<AudioPort> ports) { return 0; }
              public int listAudioPatches(ArrayList<AudioPatch> patches) { return 0; }
              public int createAudioPatch(AudioPatch[] patch, AudioPortConfig[] sources, AudioPortConfig[] sinks) { return 0; }
              public int releaseAudioPatch(AudioPatch patch) { return 0; }
              public void registerAudioPortUpdateListener(OnAudioPortUpdateListener l) {}
              public void unregisterAudioPortUpdateListener(OnAudioPortUpdateListener l) {}
              public static int setForceUse(int usage, int config) { return 0; }
              public static int getForceUse(int usage) { return 0; }
              public boolean isWiredHeadsetOn() { return false; }
              public void setParameters(String keys) {}
              public String getParameters(String keys) { return ""; }
              public int requestAudioFocus(OnAudioFocusChangeListener l, int streamType, int durationHint) { return AUDIOFOCUS_REQUEST_GRANTED; }
              public int abandonAudioFocus(OnAudioFocusChangeListener l) { return AUDIOFOCUS_REQUEST_GRANTED; }
          }
          EOF

          # 5. DisplayManagerGlobal
          cat << 'EOF' > app/src/stubs/java/android/hardware/display/DisplayManagerGlobal.java
          package android.hardware.display;
          import android.view.DisplayInfo;

          public class DisplayManagerGlobal {
              public static DisplayManagerGlobal getInstance() { return new DisplayManagerGlobal(); }
              public DisplayInfo getDisplayInfo(int displayId) { return new DisplayInfo(); }
          }
          EOF

          # 6. StorageManager
          cat << 'EOF' > app/src/stubs/java/android/os/storage/StorageManager.java
          package android.os.storage;

          public class StorageManager {
              public String getVolumeState(String mountPoint) { return ""; }
              public String[] getVolumePaths() { return new String[0]; }
          }
          EOF

          # 7. DisplayInfo
          cat << 'EOF' > app/src/stubs/java/android/view/DisplayInfo.java
          package android.view;

          public class DisplayInfo {
              public int logicalWidth;
              public int logicalHeight;
              
              public static class Mode {
                  public float getRefreshRate() { return 60.0f; }
              }
              
              public Mode getMode() { return new Mode(); }
          }
          EOF

          # Wrapper properties
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FMRadio-Android10-debug
          path: app/build/outputs/apk/debug/app-debug.apk
